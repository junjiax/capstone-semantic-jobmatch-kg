[pytest]
testpaths = tests
asyncio_mode = auto
addopts = -m "not neo4j and not external"
markers =
    unit: pure unit tests, no database or network
    integration: needs PostgreSQL + pgvector at TEST_DATABASE_URL (self-skips when unreachable)
    neo4j: needs a live Neo4j instance (deselected by default)
    external: needs network or third-party API keys such as Gemini (deselected by default)
    api: FastAPI endpoint tests through TestClient
filterwarnings =
    ignore::DeprecationWarning
